<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What to Watch - Stop Overthinking!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>What to Watch?</h1>
        <p>Stop overthinking. Let us decide for you.</p>
    </header>

    <main>
        <!-- Add to watchlist section -->
        <section id="add-section">
            <h2>Add to Your Watchlist</h2>
            <form id="add-form"> <!--form id used for javascript to read inps and handle submission-->
                <div style="position: relative;">
                    <input type="text" id="title" placeholder="Search for a movie..." autocomplete="on">
                    <div id="search-results"></div>
                </div>
                <select id="type">
                    <option value="movie">Movie</option>
                    <option value="show">TV Show</option>
                </select>
                <input type="text" id="genre" placeholder="Genre (e.g., Action, Comedy)">
                <button type="submit">Add to Watchlist</button>
            </form>
        </section>
        
        <!-- Your watchlist display -->
        <section id="watchlist-section">
            <h2>Your Watchlist</h2>
            <div id="watchlist-container">
                <!-- Movies/shows will appear here -->
            </div>
        </section>

        <!-- The decision maker -->
        <section id="picker-section">
            <h2>Can't Decide?</h2>
            <button id="pick-for-me">Pick Something For Me!</button>
            <!-- YOU BUILD THIS: Show the random pick -->
            <div id="result"></div>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
